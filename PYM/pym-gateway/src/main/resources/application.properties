# Принудительный запуск в реактивном режиме Netty
spring.main.web-application-type=reactive

# Порт шлюза внутри контейнера
server.port=9800
spring.application.name=pym-gateway

# Подключение к PostgreSQL для локальной авторизации шлюза
spring.r2dbc.url=r2dbc:postgresql://pym_db/pym_database?schema=auth_schema
spring.r2dbc.username=pym_user
spring.r2dbc.password=pym_password

# ==========================================
# МАРШРУТИЗАЦИЯ НА ВНУТРЕННИЕ СЕРВИСЫ
# ==========================================

# Запросы к данным (Go-сервис) — защищены фильтром JWT
spring.cloud.gateway.server.webflux.routes[0].id=data_service_route
spring.cloud.gateway.server.webflux.routes[0].uri=http://pym-data-service:9801
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/rules/**,/api/v1/forecast/**,/api/v1/webhooks/**

# 2. ВАЖНО: Фильтр тоже должен быть с индексом [0] и привязан к конкретному роуту!
spring.cloud.gateway.server.webflux.routes[0].filters[0]=JwtAuthenticationFilterFactory


