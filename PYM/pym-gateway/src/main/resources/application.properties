# реактивный режим для гейтвея
spring.main.web-application-type=reactive

server.port=9800
spring.application.name=pym-gateway

# подключение к базе для юзеров
spring.r2dbc.url=r2dbc:postgresql://pym_db/pym_database?schema=auth_schema
spring.r2dbc.username=pym_user
spring.r2dbc.password=pym_password

# проброс запросов в сервис на го через фильтр jwt
spring.cloud.gateway.server.webflux.routes[0].id=data_service_route
spring.cloud.gateway.server.webflux.routes[0].uri=http://pym-data-service:9801
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/state/**,/api/v1/profile/**,/api/v1/rules/**,/api/v1/counterparties/**,/api/v1/import/**,/api/v1/demo-reset/**,/api/v1/forecast/**,/api/v1/webhooks/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=JwtAuthenticationFilterFactory

# секрет для jwt (минимум 256 бит для hs256)
jwt.secret=pym-super-secret-jwt-key-for-signing-tokens-practice-s7-2026-very-secure-key
jwt.expiration=86400

