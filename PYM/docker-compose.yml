services:
  # база постгрес
  pym_db:
    image: postgres:15-alpine
    container_name: pym_db
    environment:
      POSTGRES_USER: pym_user
      POSTGRES_PASSWORD: pym_password
      POSTGRES_DB: pym_database
    ports:
      - "9803:5432" # порт наружу
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pym-network
    restart: always

  # админка для бд
  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: pym_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pym.ru
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pym-network
    depends_on:
      - pym_db
    restart: always

  # калькулятор на питоне
  pym-predictor:
    build: ./pym-predictor
    container_name: pym-predictor
    ports:
      - "9802:9802"
    networks:
      - pym-network
    depends_on:
      - pym_db

  # сервис данных на го
  pym-data-service:
    build: ./pym-data-service
    container_name: pym-data-service
    ports:
      - "9801:9801"
    environment:
      - DB_HOST=pym_db
      - DB_PORT=5432
      - DB_USER=pym_user
      - DB_PASSWORD=pym_password
      - DB_NAME=pym_database
      - PREDICTOR_URL=http://pym-predictor:9802
    networks:
      - pym-network
    depends_on:
      - pym_db
      - pym-predictor

  # гейтвей на джаве
  pym-gateway:
    build: ./pym-gateway
    container_name: pym-gateway
    ports:
      - "9800:9800"
    environment:
      - DATA_SERVICE_HOST=pym-data-service
      - DATA_SERVICE_PORT=9801
    networks:
      - pym-network
    depends_on:
      - pym_db
      - pym-data-service

  # фронт на реакте
  pym-frontend:
    build: ..
    container_name: pym-frontend
    ports:
      - "3000:80"
    networks:
      - pym-network
    depends_on:
      - pym-gateway
    restart: always

volumes:
  pgdata:
  pgadmin_data:

networks:
  pym-network:
    driver: bridge
